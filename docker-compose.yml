name: bun-hono-app

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      args:
        - USER_ID=${UID:-1000}
        - GROUP_ID=${GID:-1000}
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      BETTER_AUTH_SECRET: dev-secret-change-me
      BETTER_AUTH_URL: http://localhost
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        - USER_ID=${UID:-1000}
        - GROUP_ID=${GID:-1000}
    depends_on:
      - server

  nginx:
    image: nginx:1.30.0-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - server

volumes:
  pg_data:
