services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    working_dir: /app
    command: sh -c "[ -x node_modules/.bin/tsc ] || bun install --frozen-lockfile; bun run db:push; bun run dev"
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    environment:
      BETTER_AUTH_SECRET: dev-secret-change-me
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      BETTER_AUTH_URL: http://localhost
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: base
    working_dir: /app
    command: sh -c "[ -x node_modules/.bin/vite ] || bun install --frozen-lockfile; bun run dev"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - server

  nginx:
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"

volumes:
  server_node_modules:
  client_node_modules:
